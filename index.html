<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIDYASUDDHI - Where Academic Sponsorship Meets Elite Recruitment</title>
    <meta name="description" content="VIDYASUDDHI: Where Academic Sponsorship Meets Elite Recruitment. Discover verified scholarships, RRB Railway jobs, Banking recruitments, SSC exams, and prestigious government opportunities tailored for students and graduates." />
    <!-- Google Fonts: Plus Jakarta Sans, Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Anti-source-code script
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || 
            (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#faf6ed] dark:bg-[#1e3a5f] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-[#c9a227] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
